<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Dashboard Projet SIN</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    
    <style>
        body { font-family: 'Segoe UI', sans-serif; text-align: center; background: #2c3e50; color: white; padding-top: 50px; }
        .card { background: #34495e; padding: 20px; border-radius: 15px; display: inline-block; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        #score { font-size: 80px; color: #f1c40f; margin: 20px 0; }
    </style>
</head>
<body>

    <div class="card">
        <h1>Score en Temps Réel</h1>
        <div id="score">0</div>
        <p>Mise à jour automatique via Firebase</p>
    </div>

    <script>
        // CONFIGURATION : Remplace par l'URL de ta base Firebase
       // Ta configuration spécifique
const firebaseConfig = {
    databaseURL: "https://kkt-sin-default-rtdb.europe-west1.firebasedatabase.app/" 
};

// Initialisation
firebase.initializeApp(firebaseConfig);
const database = firebase.database();

// On écoute le tag "score" que tu as mis dans tes blocs App Inventor
database.ref('score').on('value', (snapshot) => {
    const data = snapshot.val();
    if (data !== null) {
        document.getElementById('score').innerText = data;
    } else {
        document.getElementById('score').innerText = "Pas de donnée";
    }


      
        });
    </script>
</body>
</html><!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>High Scores - Projet SIN</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Courier+Prime:wght@700&display=swap');

        body {
            background-color: #000000;
            color: #FFFFFF;
            font-family: 'Courier Prime', monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            overflow-x: hidden;
        }

        .arcade-container {
            border: 4px solid #FF0000;
            padding: 20px;
            background: #000000;
            box-shadow: 0 0 15px #FF0000, inset 0 0 10px #FF0000; 
            text-align: center;
            width: 90%;
            max-width: 600px;
            box-sizing: border-box;
        }

        h1 {
            color: #FF0000;
            font-size: 8vw;
            max-size: 3.5rem;
            margin-bottom: 20px;
            letter-spacing: 2px;
            text-shadow: 2px 2px #FFFFFF;
        }

        .blink {
            animation: blinker 1.2s linear infinite;
        }

        @keyframes blinker {
            50% { opacity: 0; }
        }

        .score-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 1.2rem;
        }

        .score-table th {
            border-bottom: 3px solid #FFFFFF;
            color: #FFFFFF;
            padding: 10px 5px;
            letter-spacing: 1px;
            font-size: 0.9rem;
        }

        .score-table td {
            padding: 12px 5px;
            border-bottom: 1px solid #333333;
        }

        .score-val {
            color: #FF0000;
            font-weight: bold;
            text-shadow: 1px 1px #FFFFFF;
        }

        .unit-status {
            margin-top: 20px;
            font-size: 0.7rem;
            color: #FFFFFF;
            text-transform: uppercase;
            border-top: 1px solid #FF0000;
            padding-top: 10px;
        }

        @media (min-width: 600px) {
            h1 { font-size: 3.5rem; }
            .score-table { font-size: 1.8rem; }
            .score-table th { font-size: 1.2rem; }
            .arcade-container { padding: 40px; border-width: 6px; }
            .unit-status { font-size: 0.9rem; }
        }
    </style>
</head>
<body>

    <main class="arcade-container">
        <h1 class="blink">TOP 5 RANKING</h1>

        <table class="score-table">
            <thead>
                <tr>
                    <th>RANG</th>
                    <th>PUNCHER</th>
                    <th>SCORE</th>
                </tr>
            </thead>
            <tbody id="score-body">
                <tr><td>1ST</td><td>WAITING...</td><td class="score-val">0</td></tr>
                <tr><td>2ND</td><td>WAITING...</td><td class="score-val">0</td></tr>
                <tr><td>3RD</td><td>WAITING...</td><td class="score-val">0</td></tr>
                <tr><td>4TH</td><td>WAITING...</td><td class="score-val">0</td></tr>
                <tr><td>5TH</td><td>WAITING...</td><td class="score-val">0</td></tr>
            </tbody>
        </table>

        <p class="unit-status" id="unit-text">UNITÉ : EN ATTENTE</p>
    </main>

    <script>
        async function loadHighScores() {
            try {
                const response = await fetch('data.json?t=' + Date.now());
                if (!response.ok) throw new Error("Erreur");
                
                const data = await response.json();
                let coups = data.coups;

                coups.sort((a, b) => b.accel - a.accel);

                const rows = document.querySelectorAll("#score-body tr");

                for (let i = 0; i < 5; i++) {
                    if (coups[i]) {
                        rows[i].cells[1].innerText = coups[i].nom || "PUNCHER_" + (i + 1);
                        rows[i].cells[2].innerText = Math.round(coups[i].accel);
                    } else {
                        rows[i].cells[1].innerText = "WAITING...";
                        rows[i].cells[2].innerText = "0";
                    }
                }
                
                document.getElementById("unit-text").innerText = "UNITÉ : ACCÉLÉRATION (m/s²)";

            } catch (error) {
                console.log("Erreur");
            }
        }

        loadHighScores();
        setInterval(loadHighScores, 5000);
    </script>

</body>
</html>
