<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Score - Projet SIN</title>
    <style>
        :root {
            --primary: #2c3e50;
            --secondary: #34495e;
            --accent: #e67e22;
            --success: #27ae60;
            --text: #ecf0f1;
        }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: var(--primary); 
            color: var(--text); 
            margin: 0; padding: 20px;
            display: flex; flex-direction: column; align-items: center;
        }
        .container { max-width: 600px; width: 100%; text-align: center; }
        
        /* Style du dernier score */
        .last-score-card {
            background: var(--secondary);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
            margin-bottom: 30px;
            border-bottom: 5px solid var(--accent);
        }
        #valeur-score { 
            font-size: 80px; 
            font-weight: bold; 
            color: var(--accent);
            text-shadow: 2px 2px 10px rgba(0,0,0,0.5);
        }

        /* Style du tableau */
        table {
            width: 100%;
            border-collapse: collapse;
            background: var(--secondary);
            border-radius: 10px;
            overflow: hidden;
        }
        th { background-color: #2c3e50; color: var(--accent); padding: 15px; text-transform: uppercase; }
        td { padding: 12px; border-bottom: 1px solid #455a64; font-size: 18px; }
        tr:last-child td { border-bottom: none; }
        tr:first-child td { color: gold; font-weight: bold; } /* Le n°1 brille */

        .status { font-size: 0.8em; color: #95a5a6; margin-top: 10px; }
    </style>
</head>
<body>

    <div class="container">
        <h1>🏆 Dashboard Projet</h1>

        <div class="last-score-card">
            <h3>DERNIER SCORE OBTENU</h3>
            <div id="valeur-score">--</div>
            <div class="status" id="update-time">En attente de données...</div>
        </div>

        <div class="leaderboard">
            <h3>🔥 TOP 5 - MEILLEURS SCORES</h3>
            <table>
                <thead>
                    <tr>
                        <th>Rang</th>
                        <th>Score</th>
                    </tr>
                </thead>
                <tbody id="table-body">
                    </tbody>
            </table>
        </div>
    </div>

    <script>
        // On récupère le Top 5 sauvegardé localement ou on crée une liste vide
        let topScores = JSON.parse(localStorage.getItem('top5Scores')) || [];

        function mettreAJourTableau() {
            const tableBody = document.getElementById('table-body');
            tableBody.innerHTML = ""; // On vide le tableau

            // On complète jusqu'à 5 lignes
            for (let i = 0; i < 5; i++) {
                let scoreText = topScores[i] ? topScores[i] : "-";
                tableBody.innerHTML += `<tr><td>#${i+1}</td><td>${scoreText}</td></tr>`;
            }
        }

        function enregistrerScore(nouveauScore) {
            let scoreNum = parseInt(nouveauScore);
            if (isNaN(scoreNum)) return;

            // Si le score n'est pas déjà dans le tableau (pour éviter les doublons au rafraîchissement)
            if (!topScores.includes(scoreNum)) {
                topScores.push(scoreNum);
                // Trier du plus grand au plus petit
                topScores.sort((a, b) => b - a);
                // Garder seulement les 5 premiers
                topScores = topScores.slice(0, 5);
                // Sauvegarder dans le navigateur
                localStorage.setItem('top5Scores', JSON.stringify(topScores));
                mettreAJourTableau();
            }
        }

        function recupererDonnees() {
            // Fetch du fichier data.json généré par Google Script
            fetch('data.json?t=' + new Date().getTime())
                .then(response => response.json())
                .then(data => {
                    const score = data.score;
                    
                    // Mise à jour de l'affichage principal
                    document.getElementById('valeur-score').innerText = score;
                    document.getElementById('update-time').innerText = "Mis à jour à : " + new Date().toLocaleTimeString();
                    
                    // Traitement pour le Top 5
                    enregistrerScore(score);
                })
                .catch(err => {
                    console.error("Erreur lecture JSON:", err);
                });
        }

        // Lancement
        mettreAJourTableau();
        setInterval(recupererDonnees, 3000); // Vérifie toutes les 3 secondes
        recupererDonnees();
    </script>
</body>
</html>
